[project]
name = "amazon-price-tracker"
version = "0.1.0"
description = "Amazon Price Tracker & Alert Engine - Event-driven price monitoring system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Gabriel" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "aio-pika>=9.4.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "structlog>=24.4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "alembic>=1.13.0",
    " APScheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.22.0",
    "httpx>=0.27.0",
    "testcontainers>=4.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
api = "api.main:run"
worker-validation = "workers.validation.consumer:run"
worker-scheduler = "workers.scheduler.scheduler:run"
worker-scraper = "workers.scraper.consumer:run"
worker-decision = "workers.decision.consumer:run"
worker-notification = "workers.notification.consumer:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["api", "core", "models", "schemas", "workers"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
